<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Play Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0b0b12; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding: 25px; background: #131324; border-radius: 12px; border: 2px solid #00ffff; box-shadow: 0 0 15px #00ffff; }
        header h1 { color: #00ffff; font-size: 2.3rem; letter-spacing: 2px; text-shadow: 0 0 10px #00ffff; }
        .ad-box { width: 100%; max-width: 728px; height: 90px; background: #18182c; border: 2px dashed #a855f7; margin: 0 auto 30px auto; display: flex; align-items: center; justify-content: center; color: #a855f7; border-radius: 8px; font-weight: bold; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #131324; border-radius: 12px; overflow: hidden; border: 1px solid #232342; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .game-frame { width: 100%; height: 220px; border: none; background: #000; }
        .game-info { padding: 12px; background: #191932; text-align: center; }
        .game-title { font-weight: bold; font-size: 1.1rem; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>NEON PLAY ZONE</h1>
        <p>Play Free Online Arcade Games Instantly</p>
    </header>

    <div class="ad-box">[ GOOGLE ADSENSE / REVENUE ADS PLACEMENT ZONE ]</div>

    <main class="game-grid">
        <div class="game-card">
            <iframe class="game-frame" src="https://gamedistribution.com" allowfullscreen></iframe>
            <div class="game-info"><div class="game-title">Moto X3M Bike Racing</div></div>
        </div>
        <div class="game-card">
            <iframe class="game-frame" src="https://gamedistribution.com" allowfullscreen></iframe>
            <div class="game-info"><div class="game-title">Pet Subway Runner</div></div>
        </div>
        <div class="game-card">
            <iframe class="game-frame" src="https://gamedistribution.com" allowfullscreen></iframe>
            <div class="game-info"><div class="game-title">Block Puzzle Master</div></div>
        </div>
        <div class="game-card">
            <iframe class="game-frame" src="https://gamedistribution.com" allowfullscreen></iframe>
            <div class="game-info"><div class="game-title">Foot Chinko Soccer</div></div>
        </div>
    </main>

</body>
</html>
